<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: #E8DCCF;
            background-image: url('bg-pola.jpg');
            background-size: 400px;
            background-repeat: repeat;
            background-blend-mode: soft-light;
            display: flex;
            min-height: 100vh;
            color: #5C4033;
        }

        .sidebar {
            width: 220px;
            background: rgba(243, 233, 220, 0.85);
            backdrop-filter: blur(5px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid #C8B8A5;
            position: fixed;
            height: 100vh;
        }

        .bow-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #B8A896;
            box-shadow: 0 4px 10px rgba(92, 64, 51, 0.15);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        .sidebar h2 {
            font-size: 20px;
            color: #5C4033;
            margin-bottom: 5px;
        }

        .sidebar .tagline {
            font-size: 13px;
            color: #8B7355;
            margin-bottom: 25px;
        }

        .sidebar-nav {
            width: 100%;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #5C4033;
            text-decoration: none;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 8px;
            background: rgba(184, 168, 150, 0.15);
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left center;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: #8B5A2B;
            color: #fff;
            transform: translateX(5px);
            box-shadow: 2px 3px 8px rgba(139, 90, 43, 0.25);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 30px;
            font-style: italic;
            color: #8B7355;
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 40px 50px;
            background: rgba(248, 240, 229, 0.7);
            min-height: 100vh;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .page-header-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .search-bar {
            background: rgba(243, 233, 220, 0.8);
            border: 1px solid #D4C4B0;
            border-radius: 20px;
            padding: 6px 15px;
            width: 180px;
            font-size: 13px;
            color: #8B7355;
        }

        .page-title {
            font-size: 36px;
            color: #5C4033;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: #8B7355;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .cert-card {
            background: rgba(255, 249, 240, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #E5D8C8;
            box-shadow: 0 3px 10px rgba(92, 64, 51, 0.08);
            transition: all 0.3s ease;
            text-align: center;
        }

        .cert-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(92, 64, 51, 0.15);
        }

        .cert-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #E0D5C5;
            margin-bottom: 15px;
        }

        .cert-card h3 {
            font-size: 18px;
            color: #5C4033;
            margin-bottom: 8px;
        }

        .cert-card p {
            font-size: 14px;
            color: #7B654F;
            line-height: 1.6;
        }

        .social-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px dashed #C8B8A5;
        }

        .social-footer a {
            color: #7B654F;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-footer a:hover {
            color: #5C4033;
            transform: translateY(-3px);
            display: inline-block;
        }
    </style>
